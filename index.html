<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Cari Kata</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#3a1c71">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:linear-gradient(160deg,#3a1c71,#d76d77,#ffaf7b);color:#fff;font-family:'Segoe UI',system-ui,sans-serif;overflow:hidden;user-select:none;-webkit-user-select:none;touch-action:none}
#app{display:flex;flex-direction:column;align-items:center;height:100%;padding:8px 10px;box-sizing:border-box}

/* ===== MAIN MENU ===== */
#menuView{width:100%;height:100%;display:flex;flex-direction:column;align-items:center;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:16px 12px 28px}
.menu-title{font-size:28px;font-weight:900;margin:0 0 4px;text-shadow:0 2px 8px #0005;text-align:center}
.menu-sub{font-size:14px;opacity:.9;margin:0 0 20px;text-align:center}
.cat-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;width:100%;max-width:480px}
@media(min-width:540px){.cat-grid{grid-template-columns:repeat(3,1fr)}}
.cat-card{background:rgba(255,255,255,.2);border:2px solid rgba(255,255,255,.4);border-radius:20px;padding:16px 10px;display:flex;flex-direction:column;align-items:center;cursor:pointer;box-shadow:0 5px 14px #0003;backdrop-filter:blur(8px);transition:transform .13s}
.cat-card:active{transform:scale(.94)}
.cat-icon{font-size:42px;margin-bottom:8px;filter:drop-shadow(0 3px 5px #0003)}
.cat-name{font-size:15px;font-weight:800;text-align:center;text-shadow:0 1px 2px #0003}
.cat-count{font-size:12px;opacity:.85;margin-top:4px;background:rgba(255,255,255,.22);padding:3px 10px;border-radius:12px;font-weight:700}

/* ===== GAME VIEW ===== */
#gameView{width:100%;height:100%;display:none;flex-direction:column;align-items:center;padding:6px 10px;box-sizing:border-box}
#hud{width:100%;max-width:480px;display:flex;justify-content:space-between;align-items:center;font-size:16px;margin-bottom:6px;font-weight:bold;text-shadow:0 1px 3px #0006}
.btn-back{background:rgba(255,255,255,.28);border:1.5px solid rgba(255,255,255,.5);color:#fff;font-size:13px;font-weight:700;padding:6px 12px;border-radius:16px;cursor:pointer;display:inline-flex;align-items:center;gap:4px;transition:transform .1s;outline:none}
.btn-back:active{transform:scale(.93);background:rgba(255,255,255,.45)}
#board{display:grid;gap:3px;width:min(94vw,52vh,480px);aspect-ratio:1;touch-action:none}
.c{display:flex;align-items:center;justify-content:center;background:#ffffffcc;color:#3a1c71;border-radius:8px;font-weight:bold;font-size:clamp(14px,5vw,24px);transition:background .12s,transform .12s;box-shadow:0 2px 0 #0002}
.c.sel{background:#ffd93d;color:#3a1c71;transform:scale(1.1)}
.c.found{color:#fff;animation:pop .5s both}
.c.shake{animation:shake .3s}
@keyframes pop{0%{transform:scale(1)}50%{transform:scale(1.45) rotate(7deg)}100%{transform:scale(1)}}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
#list{display:flex;flex-wrap:wrap;gap:7px;justify-content:center;margin-top:10px;max-width:480px}
.w{padding:6px 13px;border-radius:16px;background:#ffffff33;border:2px solid #ffffff88;font-size:14px;font-weight:bold;transition:.3s}
.w.done{text-decoration:line-through;opacity:.6;transform:scale(.9);background:#6bcB3d55;border-color:#6bcB3d}
.w.bump{animation:pop .5s}
#fx{position:fixed;inset:0;pointer-events:none}
.ov{position:fixed;inset:0;background:linear-gradient(160deg,#3a1c71dd,#d76d77dd);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding:20px;box-sizing:border-box;z-index:10}
.ov-btn{font-size:20px;padding:12px 34px;border:0;border-radius:24px;background:#ffd93d;color:#3a1c71;font-weight:bold;box-shadow:0 4px 0 #c9a415;cursor:pointer;transition:transform .1s}
.ov-btn:active{transform:translateY(3px);box-shadow:0 1px 0 #c9a415}
#menuBtn2{font-size:16px;padding:10px 24px;border:0;border-radius:18px;background:rgba(255,255,255,.28);color:#fff;font-weight:bold;cursor:pointer;transition:transform .1s}
#menuBtn2:active{transform:scale(.94)}
</style>
</head>
<body>
<canvas id="fx"></canvas>

<!-- ==================== MENU VIEW ==================== -->
<div id="menuView">
  <p class="menu-title">🔠 Cari Kata</p>
  <p class="menu-sub">Pilih kategori lalu cari kata yang tersembunyi!</p>
  <div class="cat-grid" id="catGrid"></div>
</div>

<!-- ==================== GAME VIEW ==================== -->
<div id="gameView">
  <div id="hud">
    <button class="btn-back" id="btnBack">🏠 Menu</button>
    <span id="lv"></span>
    <span>Skor: <b id="sc">0</b></span>
  </div>
  <div id="board"></div>
  <div id="list"></div>
</div>

<!-- Win overlay -->
<div class="ov" id="ov" style="display:none">
  <h1 id="ot" style="margin:0;font-size:26px;text-shadow:0 2px 6px #0005"></h1>
  <div id="oi" style="font-size:16px;opacity:.93"></div>
  <button class="ov-btn" id="goBtn">Lanjut ▶</button>
  <button id="menuBtn2">🏠 Kembali ke Menu</button>
</div>

<script>
/* ==================== DATA KATEGORI ==================== */
const CATEGORIES = {
  hewan: {
    name: 'Hewan',
    icon: '🦁',
    theme: 'linear-gradient(160deg,#0f4c1e,#1b6b3a,#4caf50)',
    words: [
      'KUCING','ANJING','SAPI','AYAM','BEBEK','KAMBING','KUDA','SINGA',
      'GAJAH','KATAK','DOMBA','BABI','ULAR','MONYET','HARIMAU','ZEBRA',
      'JERAPAH','BERUANG','RUBAH','PENGUIN','BURUNG','KELINCI','TIKUS','KURA',
      'ANGSA','KERBAU','RUSA','KIJANG','MACAN','SERIGALA'
    ]
  },
  buah: {
    name: 'Buah',
    icon: '🍎',
    theme: 'linear-gradient(160deg,#c62828,#e53935,#ff8f00)',
    words: [
      'APEL','JERUK','PISANG','MANGGA','ANGGUR','MELON','SALAK','PEPAYA',
      'JAMBU','DURIAN','ALPUKAT','KIWI','PEAR','CERI','LEMON','NANAS',
      'SEMANGKA','MARKISA','LENGKENG','RAMBUTAN','SAWO','KESEMEK','SIRSAK','BELIMBING'
    ]
  },
  sayur: {
    name: 'Sayuran',
    icon: '🥦',
    theme: 'linear-gradient(160deg,#1b5e20,#2e7d32,#66bb6a)',
    words: [
      'WORTEL','KUBIS','TOMAT','TERONG','BAYAM','KANGKUNG','LABU','JAGUNG',
      'BUNCIS','MENTIMUN','SELADA','LOBAK','SELEDRI','KENTANG','BROKOLI',
      'ASPARAGUS','PAPRIKA','CABAI','DAUN','PARE','SINGKONG','REBUNG'
    ]
  },
  warna: {
    name: 'Warna',
    icon: '🎨',
    theme: 'linear-gradient(160deg,#6a11cb,#8e2de2,#ff416c)',
    words: [
      'MERAH','BIRU','KUNING','HIJAU','UNGU','ORANYE','HITAM','PUTIH',
      'ABU','COKLAT','PINK','MAROON','TOSCA','NILA','MERAH MUDA',
      'LAVENDER','KREM','COKLAT','MAGENTA','SILVER','EMAS','BIRU TUA'
    ]
  },
  negara: {
    name: 'Negara',
    icon: '🌍',
    theme: 'linear-gradient(160deg,#0d47a1,#1565c0,#42a5f5)',
    words: [
      'INDONESIA','MALAYSIA','SINGAPURA','THAILAND','VIETNAM','FILIPINA',
      'JEPANG','KOREA','CHINA','INDIA','ARAB','MESIR','TURKI','IRAN',
      'BRAZIL','PRANCIS','ITALIA','JERMAN','INGGRIS','RUSIA','KANADA',
      'AUSTRALIA','MEKSIKO','ARGENTINA','NIGERIA','GHANA'
    ]
  },
  tubuh: {
    name: 'Tubuh',
    icon: '👃',
    theme: 'linear-gradient(160deg,#880e4f,#c2185b,#f06292)',
    words: [
      'MATA','TELINGA','HIDUNG','MULUT','GIGI','LIDAH','TANGAN','KAKI',
      'JARI','KEPALA','LEHER','BAHU','PERUT','PUNGGUNG','DADA','LUTUT',
      'SIKU','PAHA','BETIS','TUMIT','RAMBUT','ALIS','PIPI','DAGU','JIDAT'
    ]
  },
  sekolah: {
    name: 'Sekolah',
    icon: '🎒',
    theme: 'linear-gradient(160deg,#004d40,#00796b,#4db6ac)',
    words: [
      'BUKU','PENSIL','PULPEN','MEJA','KURSI','PAPAN','GURU','MURID',
      'KELAS','UJIAN','NILAI','RAPORT','KANTIN','PERPUSTAKAAN','KAPUR',
      'PENGGARIS','GUNTING','KERTAS','PETA','GLOBE','PENGHAPUS','RAPOR'
    ]
  },
  kota: {
    name: 'Kota Indonesia',
    icon: '🏙️',
    theme: 'linear-gradient(160deg,#bf360c,#e64a19,#ffb74d)',
    words: [
      'JAKARTA','BANDUNG','SURABAYA','MEDAN','SEMARANG','MAKASSAR','BALI',
      'JOGJA','SOLO','MALANG','BOGOR','BEKASI','DEPOK','BATAM','MANADO',
      'PADANG','PALEMBANG','PEKANBARU','BANJARMASIN','PONTIANAK','ACEH',
      'KUPANG','AMBON','JAYAPURA','SORONG','TERNATE','KENDARI','PALU'
    ]
  }
};

/* ==================== STATE ==================== */
let currentCatKey = null;
let level = 0;
let N = 8;
let grid, wordList, foundSet, score = 0, cells, startCell = null, selPath = [];

const DIRS = [[0, 1], [1, 0]]; // hanya mendatar dan menurun agar mudah dibaca anak

/* ==================== UTILS ==================== */
const $ = id => document.getElementById(id);
const menuView = $('menuView');
const gameView = $('gameView');

/* ==================== SOUND ==================== */
let ac;
function tone(f, d = .12, type = 'sine', at = 0, v = .15) {
  try {
    ac = ac || new (window.AudioContext || window.webkitAudioContext)();
    const o = ac.createOscillator(), g = ac.createGain(), t = ac.currentTime + at;
    o.type = type; o.frequency.value = f;
    g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(.001, t + d);
    o.connect(g); g.connect(ac.destination); o.start(t); o.stop(t + d);
  } catch (e) {}
}
const buzz = p => navigator.vibrate && navigator.vibrate(p);
const sfxClick = () => tone(600, .06, 'sine', 0, .14);
const sfxSelect = () => tone(400, .06, 'sine', 0, .1);
const sfxFound = () => [523, 659, 784, 1047].forEach((f, i) => tone(f, .18, 'triangle', i * .09));
const sfxFail = () => { tone(150, .22, 'sawtooth', 0, .1); buzz(80); };
const sfxWin = () => [523, 659, 784, 659, 784, 1047, 1319].forEach((f, i) => tone(f, .22, 'square', i * .11, .08));

/* ==================== MENU ==================== */
function renderMenu() {
  const grid = $('catGrid');
  grid.innerHTML = Object.entries(CATEGORIES).map(([key, cat]) => `
    <div class="cat-card" onclick="startCategory('${key}')">
      <div class="cat-icon">${cat.icon}</div>
      <div class="cat-name">${cat.name}</div>
      <div class="cat-count">${cat.words.length} kata</div>
    </div>
  `).join('');
}

function startCategory(key) {
  sfxClick();
  currentCatKey = key;
  level = 0;
  score = 0;
  $('sc').textContent = '0';
  const cat = CATEGORIES[key];
  document.body.style.background = cat.theme;
  menuView.style.display = 'none';
  gameView.style.display = 'flex';
  buildLevel();
  try { ac = ac || new (window.AudioContext || window.webkitAudioContext)(); ac.resume(); } catch (e) {}
}

function returnToMenu() {
  sfxClick();
  gameView.style.display = 'none';
  $('ov').style.display = 'none';
  menuView.style.display = 'flex';
  document.body.style.background = 'linear-gradient(160deg,#3a1c71,#d76d77,#ffaf7b)';
  if ('speechSynthesis' in window) speechSynthesis.cancel();
}

$('btnBack').onclick = returnToMenu;
$('menuBtn2').onclick = returnToMenu;

/* ==================== GRID BUILDER ==================== */
/**
 * BUGFIX: Kata yang GAGAL ditempatkan ke dalam grid (karena 300 percobaan habis)
 * akan dihapus dari daftar wordList sehingga tidak muncul di daftar
 * yang harus dicari tapi tidak ada di grid.
 */
function buildLevel() {
  const cat = CATEGORIES[currentCatKey];
  // Grid ukuran 8 di semua level agar konsisten
  N = 8;

  // Filter kata yang panjangnya <= N, lalu acak dan ambil 5
  const eligible = cat.words.filter(w => w.replace(/\s/g, '').length <= N);
  const shuffled = [...eligible].sort(() => Math.random() - .5);

  grid = Array.from({ length: N }, () => Array(N).fill(''));

  // Coba tempatkan kata satu per satu, HANYA tambahkan ke wordList jika BERHASIL
  const placed = [];
  for (const word of shuffled) {
    const cleanWord = word.replace(/\s/g, ''); // hapus spasi untuk grid
    const displayWord = word; // tampilkan dengan spasi aslinya
    if (placed.length >= 5) break;
    if (tryPlace(cleanWord)) {
      placed.push({ display: displayWord, clean: cleanWord });
    }
  }

  wordList = placed; // HANYA kata yang berhasil ditempatkan!
  foundSet = new Set();

  // Isi sisa grid dengan huruf acak
  const FILLER = 'ABCDEFGHIJKLMNOPRSTUW';
  for (let r = 0; r < N; r++)
    for (let c = 0; c < N; c++)
      if (!grid[r][c]) grid[r][c] = FILLER[Math.random() * FILLER.length | 0];

  // Render board
  $('lv').textContent = 'Level ' + (level + 1) + ' · ' + CATEGORIES[currentCatKey].name;
  const board = $('board');
  board.innerHTML = '';
  board.style.gridTemplateColumns = `repeat(${N},1fr)`;
  cells = [];
  for (let r = 0; r < N; r++) {
    for (let c = 0; c < N; c++) {
      const d = document.createElement('div');
      d.className = 'c';
      d.textContent = grid[r][c];
      d.dataset.r = r;
      d.dataset.c = c;
      board.appendChild(d);
      cells.push(d);
    }
  }

  // Render word list — tampilkan dengan format asli (ada spasi)
  $('list').innerHTML = wordList.map(item =>
    `<span class="w" id="wc-${item.clean}">${item.display}</span>`
  ).join('');

  // Jika tidak ada kata yang bisa ditempatkan (sangat jarang), fallback
  if (wordList.length === 0) {
    setTimeout(buildLevel, 100);
  }
}

/**
 * Coba tempatkan satu kata ke dalam grid.
 * Return true jika berhasil, false jika tidak dalam 300 percobaan.
 */
function tryPlace(word) {
  for (let attempt = 0; attempt < 300; attempt++) {
    const [dr, dc] = DIRS[Math.random() * DIRS.length | 0];
    const r = Math.random() * N | 0;
    const c = Math.random() * N | 0;
    const er = r + dr * (word.length - 1);
    const ec = c + dc * (word.length - 1);
    if (er < 0 || er >= N || ec < 0 || ec >= N) continue;

    let canPlace = true;
    for (let i = 0; i < word.length; i++) {
      const existing = grid[r + dr * i][c + dc * i];
      if (existing && existing !== word[i]) { canPlace = false; break; }
    }
    if (!canPlace) continue;

    // Tempatkan
    for (let i = 0; i < word.length; i++) grid[r + dr * i][c + dc * i] = word[i];
    return true;
  }
  return false; // gagal
}

/* ==================== INPUT HANDLING ==================== */
const cellAt = (x, y) => {
  const e = document.elementFromPoint(x, y);
  return e && e.dataset && e.dataset.r !== undefined ? e : null;
};

function calcPath(a, b) {
  const dr = b.r - a.r, dc = b.c - a.c;
  if (!(dr === 0 || dc === 0)) return null;
  const n = Math.max(Math.abs(dr), Math.abs(dc));
  const sr = Math.sign(dr), sc = Math.sign(dc);
  const p = [];
  for (let i = 0; i <= n; i++) p.push([a.r + sr * i, a.c + sc * i]);
  return p;
}

function paintSel() {
  cells.forEach(c => c.classList.remove('sel'));
  selPath.forEach(([r, c]) => cells[r * N + c].classList.add('sel'));
}

const board = $('board');
board.addEventListener('pointerdown', e => {
  const el = cellAt(e.clientX, e.clientY); if (!el) return;
  board.setPointerCapture(e.pointerId);
  startCell = { r: +el.dataset.r, c: +el.dataset.c };
  selPath = [[startCell.r, startCell.c]];
  paintSel(); sfxSelect();
});

board.addEventListener('pointermove', e => {
  if (!startCell) return;
  const el = cellAt(e.clientX, e.clientY); if (!el) return;
  const p = calcPath(startCell, { r: +el.dataset.r, c: +el.dataset.c });
  if (p && p.length !== selPath.length) {
    selPath = p; paintSel();
    tone(380 + p.length * 55, .05, 'sine', 0, .07);
  } else if (p) selPath = p;
});

board.addEventListener('pointerup', () => {
  if (!startCell) return;
  const typed = selPath.map(([r, c]) => grid[r][c]).join('');
  const rev = [...typed].reverse().join('');
  const hit = wordList.find(item => !foundSet.has(item.clean) && (item.clean === typed || item.clean === rev));
  const cur = selPath.slice(); startCell = null; selPath = []; paintSel();
  if (hit) markFound(hit, cur);
  else if (cur.length > 1) {
    cur.forEach(([r, c]) => {
      const el = cells[r * N + c];
      el.classList.add('shake');
      setTimeout(() => el.classList.remove('shake'), 320);
    });
    sfxFail();
  }
});

/* ==================== MARK FOUND ==================== */
function markFound(item, path) {
  foundSet.add(item.clean);
  const hue = foundSet.size * 57 % 360;
  path.forEach(([r, c], i) => {
    const el = cells[r * N + c];
    el.classList.remove('found'); void el.offsetWidth;
    el.style.background = `hsl(${hue},70%,42%)`;
    el.style.animationDelay = i * 55 + 'ms';
    el.classList.add('found');
  });
  const chip = $('wc-' + item.clean);
  if (chip) chip.classList.add('done', 'bump');
  score += item.clean.length * 10;
  $('sc').textContent = score;
  sfxFound(); buzz([30, 40, 30]);
  const mid = path[path.length >> 1];
  const rc = cells[mid[0] * N + mid[1]].getBoundingClientRect();
  confetti(rc.left + rc.width / 2, rc.top + rc.height / 2, 50);
  if (foundSet.size === wordList.length) setTimeout(showWin, 900);
}

/* ==================== WIN ==================== */
function showWin() {
  score += 50; $('sc').textContent = score; sfxWin(); buzz([100, 50, 100, 50, 200]);
  confetti(innerWidth / 2, innerHeight / 3, 200);
  const best = Math.max(score, +localStorage.getItem('carikata_best') || 0);
  localStorage.setItem('carikata_best', best);
  $('ot').textContent = 'Level ' + (level + 1) + ' Selesai! 🎉';
  $('oi').innerHTML = 'Skor: ' + score + ' &nbsp;·&nbsp; Terbaik: ' + best;
  $('ov').style.display = 'flex';
}

$('goBtn').onclick = () => {
  $('ov').style.display = 'none';
  level++;
  buildLevel();
  try { ac.resume(); } catch (e) {}
};

/* ==================== CONFETTI ==================== */
const cv = $('fx'), cx = cv.getContext('2d');
let ps = [], running = false;
function resizeCv() { cv.width = innerWidth; cv.height = innerHeight; }
resizeCv(); addEventListener('resize', resizeCv);

function confetti(x, y, n) {
  for (let i = 0; i < n; i++)
    ps.push({ x, y, vx: (Math.random() - .5) * 13, vy: -Math.random() * 13 - 3, s: 4 + Math.random() * 6, h: Math.random() * 360, l: 70 });
  if (!running) { running = true; requestAnimationFrame(tickConfetti); }
}

function tickConfetti() {
  cx.clearRect(0, 0, cv.width, cv.height);
  ps.forEach(p => {
    p.x += p.vx; p.y += p.vy; p.vy += .35; p.l--;
    cx.fillStyle = `hsl(${p.h},90%,60%)`;
    cx.fillRect(p.x, p.y, p.s, p.s);
  });
  ps = ps.filter(p => p.l > 0 && p.y < cv.height);
  if (ps.length) requestAnimationFrame(tickConfetti);
  else { running = false; cx.clearRect(0, 0, cv.width, cv.height); }
}

/* ==================== INIT ==================== */
renderMenu();
</script>
<script>if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');</script>
</body>
</html>
