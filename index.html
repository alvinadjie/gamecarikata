<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Cari Kata / Word Search</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#3a1c71">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:linear-gradient(160deg,#3a1c71,#d76d77,#ffaf7b);color:#fff;font-family:'Segoe UI',system-ui,sans-serif;overflow:hidden;user-select:none;-webkit-user-select:none;touch-action:none}

/* ===== LANGUAGE SELECT ===== */
#langView{width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;gap:20px}
.lang-title{font-size:32px;font-weight:900;margin:0;text-shadow:0 3px 10px #0005;text-align:center;letter-spacing:1px}
.lang-sub{font-size:15px;opacity:.9;margin:0;text-align:center}
.lang-list{display:flex;gap:16px;justify-content:center;flex-wrap:wrap;width:100%;max-width:380px}
.lang-card{flex:1;min-width:140px;max-width:170px;background:rgba(255,255,255,.22);border:2.5px solid rgba(255,255,255,.45);border-radius:24px;padding:20px 14px;display:flex;flex-direction:column;align-items:center;cursor:pointer;box-shadow:0 6px 18px #0003;backdrop-filter:blur(10px);transition:transform .14s,background .14s;gap:10px}
.lang-card:active{transform:scale(.93);background:rgba(255,255,255,.4)}
.lang-flag{font-size:52px;line-height:1}
.lang-name{font-size:17px;font-weight:900;text-shadow:0 1px 3px #0004}
.lang-native{font-size:12px;opacity:.85;font-weight:600}

/* ===== MENU UTAMA ===== */
#menuView{width:100%;height:100%;display:none;flex-direction:column;align-items:center;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:12px 12px 28px}
.menu-header{width:100%;max-width:480px;display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;gap:8px}
.menu-title{font-size:22px;font-weight:900;margin:0;text-shadow:0 2px 8px #0005;flex:1}
.btn-lang{background:rgba(255,255,255,.28);border:1.5px solid rgba(255,255,255,.5);color:#fff;font-size:13px;font-weight:700;padding:7px 13px;border-radius:16px;cursor:pointer;display:inline-flex;align-items:center;gap:5px;transition:transform .1s;outline:none;white-space:nowrap}
.btn-lang:active{transform:scale(.93)}
.menu-sub{font-size:13px;opacity:.88;margin:0 0 14px;text-align:center;width:100%;max-width:480px}
.cat-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:11px;width:100%;max-width:480px}
@media(min-width:540px){.cat-grid{grid-template-columns:repeat(3,1fr)}}
.cat-card{background:rgba(255,255,255,.2);border:2px solid rgba(255,255,255,.4);border-radius:20px;padding:14px 10px;display:flex;flex-direction:column;align-items:center;cursor:pointer;box-shadow:0 5px 14px #0003;backdrop-filter:blur(8px);transition:transform .13s,background .13s}
.cat-card:active{transform:scale(.94);background:rgba(255,255,255,.35)}
.cat-icon{font-size:38px;margin-bottom:6px;filter:drop-shadow(0 3px 5px #0003)}
.cat-name{font-size:14px;font-weight:800;text-align:center;text-shadow:0 1px 2px #0003}
.cat-count{font-size:11px;opacity:.85;margin-top:4px;background:rgba(255,255,255,.22);padding:2px 9px;border-radius:11px;font-weight:700}

/* ===== LEVEL SELECT ===== */
#levelView{width:100%;height:100%;display:none;flex-direction:column;align-items:center;justify-content:center;padding:20px 16px;gap:14px}
.lv-header{text-align:center}
.lv-header h2{margin:0 0 4px;font-size:21px;font-weight:900;text-shadow:0 2px 6px #0005}
.lv-header p{margin:0;font-size:13px;opacity:.9}
.lv-list{display:flex;flex-direction:column;gap:12px;width:100%;max-width:380px}
.lv-card{display:flex;align-items:center;gap:14px;padding:14px 18px;border-radius:22px;cursor:pointer;border:2.5px solid rgba(255,255,255,.5);box-shadow:0 5px 16px #0003;backdrop-filter:blur(8px);transition:transform .13s}
.lv-card:active{transform:scale(.95)}
.lv-card.easy{background:linear-gradient(135deg,rgba(76,175,80,.45),rgba(56,142,60,.55))}
.lv-card.medium{background:linear-gradient(135deg,rgba(255,193,7,.4),rgba(245,124,0,.5))}
.lv-card.hard{background:linear-gradient(135deg,rgba(244,67,54,.4),rgba(183,28,28,.55))}
.lv-badge{font-size:34px;flex-shrink:0}
.lv-info{flex:1}
.lv-name{font-size:17px;font-weight:900;text-shadow:0 1px 3px #0004;margin-bottom:3px}
.lv-desc{font-size:11px;opacity:.9;line-height:1.5}
.lv-star{font-size:16px;letter-spacing:2px;margin-top:2px}
.btn-back-lv{background:rgba(255,255,255,.25);border:1.5px solid rgba(255,255,255,.45);color:#fff;font-size:13px;font-weight:700;padding:8px 16px;border-radius:16px;cursor:pointer;align-self:flex-start;display:inline-flex;align-items:center;gap:5px;transition:transform .1s;outline:none}
.btn-back-lv:active{transform:scale(.93)}

/* ===== GAME VIEW ===== */
#gameView{width:100%;height:100%;display:none;flex-direction:column;align-items:center;padding:6px 10px 8px;box-sizing:border-box}
#hud{width:100%;max-width:520px;display:flex;justify-content:space-between;align-items:center;font-size:15px;margin-bottom:5px;font-weight:bold;text-shadow:0 1px 3px #0006;gap:6px}
.btn-sm{background:rgba(255,255,255,.28);border:1.5px solid rgba(255,255,255,.5);color:#fff;font-size:12px;font-weight:700;padding:5px 11px;border-radius:14px;cursor:pointer;white-space:nowrap;display:inline-flex;align-items:center;gap:4px;transition:transform .1s;outline:none}
.btn-sm:active{transform:scale(.93);background:rgba(255,255,255,.45)}
#hud-mid{display:flex;flex-direction:column;align-items:center;gap:2px;flex:1}
#lv{font-size:13px;font-weight:800;opacity:.95}
#diff-badge{font-size:11px;padding:2px 8px;border-radius:10px;font-weight:800;white-space:nowrap}
#diff-badge.easy{background:#4caf50cc}
#diff-badge.medium{background:#ffc107cc;color:#3a1c71}
#diff-badge.hard{background:#f44336cc}
#board{display:grid;touch-action:none;margin:0 auto}
.c{display:flex;align-items:center;justify-content:center;background:#ffffffcc;color:#3a1c71;border-radius:7px;font-weight:bold;transition:background .12s,transform .12s;box-shadow:0 2px 0 #0002;line-height:1}
.c.sel{background:#ffd93d;color:#3a1c71;transform:scale(1.08)}
.c.found{color:#fff;animation:pop .45s both}
.c.shake{animation:shake .3s}
@keyframes pop{0%{transform:scale(1)}50%{transform:scale(1.5) rotate(7deg)}100%{transform:scale(1)}}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
#list{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;max-width:520px;margin-top:8px}
.w{padding:5px 12px;border-radius:14px;background:#ffffff33;border:2px solid #ffffff88;font-size:13px;font-weight:bold;transition:.3s}
.w.done{text-decoration:line-through;opacity:.55;transform:scale(.9);background:#6bcB3d55;border-color:#6bcB3d}
.w.bump{animation:pop .45s}
#fx{position:fixed;inset:0;pointer-events:none;z-index:5}
.ov{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding:24px;box-sizing:border-box;z-index:20;backdrop-filter:blur(6px)}
.ov-inner{background:rgba(58,28,113,.88);border-radius:28px;padding:26px 22px;display:flex;flex-direction:column;align-items:center;gap:12px;max-width:340px;width:100%;box-shadow:0 12px 40px #0006;border:2px solid rgba(255,255,255,.3)}
.ov-btn{font-size:17px;padding:11px 28px;border:0;border-radius:20px;background:#ffd93d;color:#3a1c71;font-weight:bold;box-shadow:0 4px 0 #c9a415;cursor:pointer;transition:transform .1s;width:100%}
.ov-btn:active{transform:translateY(3px);box-shadow:0 1px 0 #c9a415}
.ov-btn-ghost{font-size:13px;padding:9px 18px;border:0;border-radius:16px;background:rgba(255,255,255,.22);color:#fff;font-weight:bold;cursor:pointer;transition:transform .1s;width:100%}
.ov-btn-ghost:active{transform:scale(.94)}

<!-- ==================== GAME VIEW ==================== -->
<div id="gameView">

    <button class="ov-btn" id="goBtn">Lanjut ▶</button>
    <button class="ov-btn-ghost" id="changeDiffBtn">🎯 Ganti Kesulitan</button>

/* ==================== STATE ==================== */
let lang         = 'id';       // 'id' | 'en'
let currentCatKey = null;

/* ==================== SOUND ==================== */
let ac;
function tone(f, d=.12, type='sine', at=0, v=.15) {
  try {
    ac = ac || new (window.AudioContext || window.webkitAudioContext)();
    const o=ac.createOscillator(), g=ac.createGain(), t=ac.currentTime+at;
    o.type=type; o.frequency.value=f;
    g.gain.setValueAtTime(v,t); g.gain.exponentialRampToValueAtTime(.001,t+d);
    o.connect(g); g.connect(ac.destination); o.start(t); o.stop(t+d);
  } catch(e){}
}
const buzz       = p => navigator.vibrate && navigator.vibrate(p);
const sfxClick   = () => tone(600,.06,'sine',0,.14);
const sfxSelect  = () => tone(400,.06,'sine',0,.1);

const sfxWin     = () => [523,659,784,659,784,1047,1319].forEach((f,i)=>tone(f,.22,'square',i*.11,.08));

function setLang(l) {
  sfxClick();
  lang = l;
  showMenu();
}

function showMenu() {
  langView.style.display  = 'none';
  menuView.style.display  = 'flex';
  levelView.style.display = 'none';
  gameView.style.display  = 'none';
  $('ov').style.display   = 'none';
  document.body.style.background = 'linear-gradient(160deg,#3a1c71,#d76d77,#ffaf7b)';
  applyI18nMenu();
  renderMenu();
}

function applyI18nMenu() {
  $('menuTitle').textContent  = T('appTitle');
  $('menuSub').textContent    = T('menuSub');
  $('btnChangeLang').textContent = T('langBtn');
}

function showLevelSelect(key) {
  sfxClick();
  currentCatKey = key;
  const cat = CATEGORIES[key];
  $('lvCatTitle').textContent = cat.icon + ' ' + cat.name[lang];
  $('lvPickText').textContent = T('pickDiff');
  $('btnBackToMenuLabel').textContent = T('back');
  renderLevelCards();
  document.body.style.background = cat.theme;
  langView.style.display  = 'none';
  menuView.style.display  = 'none';
  levelView.style.display = 'flex';
  gameView.style.display  = 'none';
}

function startGame(diffKey) {
  sfxClick();
  currentDiff = diffKey;
  level = 0;
  score = 0;
  $('sc').textContent = '0';
  $('btnBackLabel').textContent = T('menuLabel');
  $('scoreLabel').innerHTML = T('scoreLabel') + ' <b id="sc">0</b>';
  $('goBtn').textContent        = T('nextBtn');
  $('changeDiffBtn').textContent = T('changeDiff');
  $('menuBtn2').textContent     = T('menuBtn');
  levelView.style.display = 'none';
  gameView.style.display  = 'flex';

  const diffs = DIFFICULTIES(lang);
  const diff  = diffs[diffKey];
  const badge = $('diff-badge');
  badge.textContent = diff.emoji + ' ' + diff.label;
  badge.className   = 'diff-badge ' + diff.badge;
  badge.id          = 'diff-badge';

  buildLevel();
  try { ac = ac||new (window.AudioContext||window.webkitAudioContext)(); ac.resume(); } catch(e){}
}

$('btnBack').onclick       = () => { sfxClick(); gameView.style.display='none'; $('ov').style.display='none'; showLevelSelect(currentCatKey); };
$('btnBackToMenu').onclick = () => { sfxClick(); showMenu(); };
$('menuBtn2').onclick      = showMenu;
$('changeDiffBtn').onclick = () => { sfxClick(); $('ov').style.display='none'; gameView.style.display='none'; showLevelSelect(currentCatKey); };

/* ==================== RENDER ==================== */
function renderMenu() {
  $('catGrid').innerHTML = Object.entries(CATEGORIES).map(([key, cat]) => `
    <div class="cat-card" onclick="showLevelSelect('${key}')">
      <div class="cat-icon">${cat.icon}</div>
      <div class="cat-name">${cat.name[lang]}</div>
      <div class="cat-count">${cat.words[lang].length} ${T('wordsCount')}</div>
    </div>
  `).join('');
}

function renderLevelCards() {
  const diffs = DIFFICULTIES(lang);
  const descs = { easy: T('descEasy'), medium: T('descMedium'), hard: T('descHard') };
  const stars = { easy: '⭐', medium: '⭐⭐', hard: '⭐⭐⭐' };
  $('lvList').innerHTML = Object.entries(diffs).map(([key, d]) => `
    <div class="lv-card ${d.badge}" onclick="startGame('${key}')">
      <div class="lv-badge">${d.emoji}</div>
      <div class="lv-info">
        <div class="lv-name">${d.label}</div>
        <div class="lv-desc">${descs[key].replace('\n','<br>')}</div>
        <div class="lv-star">${stars[key]}</div>
      </div>
    </div>
  `).join('');
}

/* ==================== GRID BUILDER ==================== */
function buildLevel() {
  const cat   = CATEGORIES[currentCatKey];
  const diffs = DIFFICULTIES(lang);
  const diff  = diffs[currentDiff];
  N           = diff.N;
  DIRS_ACTIVE = diff.dirs;

  const wordPool = cat.words[lang];
  const eligible = wordPool.filter(w => w.replace(/\s/g,'').length <= diff.maxLen);
  const shuffled = [...eligible].sort(() => Math.random() - .5);

  grid = Array.from({length:N}, () => Array(N).fill(''));

  const placed = [];
  for (const word of shuffled) {
    if (placed.length >= diff.wordCount) break;
    const clean = word.replace(/\s/g,'');
    if (clean.length > N) continue;
    if (tryPlace(clean)) placed.push({ display: word, clean });
  }

  // Fallback: relaksasi maxLen → semua kata yang ≤ N
  if (placed.length < 2) {
    const fallback = wordPool.filter(w => w.replace(/\s/g,'').length <= N)
      .sort(() => Math.random() - .5);
    for (const word of fallback) {
      if (placed.length >= diff.wordCount) break;
      const clean = word.replace(/\s/g,'');
      if (placed.some(p => p.clean === clean)) continue;
      if (tryPlace(clean)) placed.push({ display: word, clean });
    }
  }

  wordList = placed;
  foundSet = new Set();

  const FILLER = 'ABCDEFGHIJKLMNOPRSTUW';
  for (let r=0;r<N;r++)
    for (let c=0;c<N;c++)
      if (!grid[r][c]) grid[r][c] = FILLER[Math.random()*FILLER.length|0];

  // HUD label
  $('lv').textContent = T('levelLabel') + ' ' + (level+1) + ' · ' + cat.name[lang];

  // Board
  const boardEl = $('board');
  boardEl.innerHTML = '';
  boardEl.style.gridTemplateColumns = `repeat(${N},1fr)`;
  const boardSize = Math.min(window.innerWidth*.96, window.innerHeight*.52, 520);
  const cellSize  = Math.floor(boardSize/N) - 3;
  boardEl.style.width = (cellSize*N + 3*(N-1)) + 'px';
  boardEl.style.gap   = '3px';
  const fontSize = Math.max(10, Math.min(Math.floor(cellSize*.5), 24));

  cells = [];
  for (let r=0;r<N;r++) {
    for (let c=0;c<N;c++) {
      const d = document.createElement('div');
      d.className = 'c';
      d.textContent = grid[r][c];
      d.dataset.r = r; d.dataset.c = c;
      d.style.cssText = `width:${cellSize}px;height:${cellSize}px;font-size:${fontSize}px`;
      boardEl.appendChild(d);
      cells.push(d);
    }
  }

  $('list').innerHTML = wordList.map(item =>
    `<span class="w" id="wc-${item.clean}">${item.display}</span>`
  ).join('');

  if (wordList.length === 0) setTimeout(buildLevel, 100);
}

function tryPlace(word) {
  for (let attempt=0; attempt<400; attempt++) {
    const [dr,dc] = DIRS_ACTIVE[Math.random()*DIRS_ACTIVE.length|0];
    const r=Math.random()*N|0, c=Math.random()*N|0;
    const er=r+dr*(word.length-1), ec=c+dc*(word.length-1);
    if (er<0||er>=N||ec<0||ec>=N) continue;
    let ok=true;
    for (let i=0;i<word.length;i++) {
      const ex=grid[r+dr*i][c+dc*i];
      if (ex && ex!==word[i]) { ok=false; break; }
    }
    if (!ok) continue;
    for (let i=0;i<word.length;i++) grid[r+dr*i][c+dc*i]=word[i];
    return true;
  }
  return false;
}

/* ==================== INPUT ==================== */
const cellAt = (x,y) => {
  const e=document.elementFromPoint(x,y);
  return e&&e.dataset&&e.dataset.r!==undefined?e:null;
};

function calcPath(a,b) {
  const dr=b.r-a.r, dc=b.c-a.c;
  const diagOk = DIRS_ACTIVE.length > 2;
  const valid = (dr===0||dc===0)||(diagOk&&Math.abs(dr)===Math.abs(dc));
  if (!valid) return null;
  const n=Math.max(Math.abs(dr),Math.abs(dc));
  const sr=Math.sign(dr), sc=Math.sign(dc);
  const p=[];
  for (let i=0;i<=n;i++) p.push([a.r+sr*i,a.c+sc*i]);
  return p;
}

function paintSel() {
  cells.forEach(c=>c.classList.remove('sel'));
  selPath.forEach(([r,c])=>cells[r*N+c].classList.add('sel'));
}

const boardEl = $('board');
boardEl.addEventListener('pointerdown', e=>{
  const el=cellAt(e.clientX,e.clientY); if(!el) return;
  boardEl.setPointerCapture(e.pointerId);
  startCell={r:+el.dataset.r,c:+el.dataset.c};
  selPath=[[startCell.r,startCell.c]];
  paintSel(); sfxSelect();
});
boardEl.addEventListener('pointermove', e=>{
  if(!startCell) return;
  const el=cellAt(e.clientX,e.clientY); if(!el) return;
  const p=calcPath(startCell,{r:+el.dataset.r,c:+el.dataset.c});
  if(p&&p.length!==selPath.length){selPath=p;paintSel();tone(380+p.length*55,.05,'sine',0,.07);}
  else if(p) selPath=p;
});
boardEl.addEventListener('pointerup', ()=>{
  if(!startCell) return;
  const typed=selPath.map(([r,c])=>grid[r][c]).join('');
  const rev=[...typed].reverse().join('');
  const hit=wordList.find(item=>!foundSet.has(item.clean)&&(item.clean===typed||item.clean===rev));
  const cur=selPath.slice(); startCell=null; selPath=[]; paintSel();
  if(hit) markFound(hit,cur);
  else if(cur.length>1){
    cur.forEach(([r,c])=>{const el=cells[r*N+c];el.classList.add('shake');setTimeout(()=>el.classList.remove('shake'),320)});
    sfxFail();
  }
});

/* ==================== MARK FOUND ==================== */
function markFound(item, path) {
  foundSet.add(item.clean);
  const hue=foundSet.size*57%360;
  path.forEach(([r,c],i)=>{
    const el=cells[r*N+c];
    el.classList.remove('found'); void el.offsetWidth;
    el.style.background=`hsl(${hue},70%,42%)`;
    el.style.animationDelay=i*50+'ms';
    el.classList.add('found');
  });
  const chip=$('wc-'+item.clean);
  if(chip) chip.classList.add('done','bump');
  score+=item.clean.length*10;
  $('sc').textContent=score;
  sfxFound(); buzz([30,40,30]);
  const mid=path[path.length>>1];
  const rc=cells[mid[0]*N+mid[1]].getBoundingClientRect();
  confetti(rc.left+rc.width/2,rc.top+rc.height/2,50);
  if(foundSet.size===wordList.length) setTimeout(showWin,900);
}

/* ==================== WIN ==================== */
function showWin() {
  score+=50; $('sc').textContent=score; sfxWin(); buzz([100,50,100,50,200]);
  confetti(innerWidth/2,innerHeight/3,200);
  const bestKey='carikata_best_'+lang+'_'+currentCatKey+'_'+currentDiff;
  const best=Math.max(score,+localStorage.getItem(bestKey)||0);
  localStorage.setItem(bestKey,best);
  const diffs=DIFFICULTIES(lang);
  const diff=diffs[currentDiff];
  $('ot').textContent = T('levelLabel')+' '+(level+1)+' '+T('levelDone')+' 🎉';
  $('oi').innerHTML   = diff.emoji+' '+diff.label+
    '<br>'+T('scoreLabel')+' <b>'+score+'</b> &nbsp;·&nbsp; '+T('bestLabel')+': <b>'+best+'</b>';
  $('ov').style.display='flex';
}

$('goBtn').onclick = () => {
  $('ov').style.display='none'; level++; buildLevel();
  try{ac.resume();}catch(e){}
};

/* ==================== CONFETTI ==================== */
const cv=$('fx'), cx=cv.getContext('2d');
let ps=[], running=false;
function resizeCv(){cv.width=innerWidth;cv.height=innerHeight;}
resizeCv(); addEventListener('resize',resizeCv);
function confetti(x,y,n){
  for(let i=0;i<n;i++)
    ps.push({x,y,vx:(Math.random()-.5)*13,vy:-Math.random()*13-3,s:4+Math.random()*6,h:Math.random()*360,l:70});
  if(!running){running=true;requestAnimationFrame(tick);}
}
function tick(){
  cx.clearRect(0,0,cv.width,cv.height);
  ps.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.35;p.l--;cx.fillStyle=`hsl(${p.h},90%,60%)`;cx.fillRect(p.x,p.y,p.s,p.s);});
  ps=ps.filter(p=>p.l>0&&p.y<cv.height);
  if(ps.length)requestAnimationFrame(tick);
  else{running=false;cx.clearRect(0,0,cv.width,cv.height);}
}

/* ==================== INIT ==================== */
// Tampilkan layar pilih bahasa di awal
langView.style.display='flex';
</script>
